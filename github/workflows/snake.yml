name: Generate Robot

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate robot contribution svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-robot.svg?color_snake=%2358a6ff&color_dot_0=%23161b22&color_dot_1=%230e4429&color_dot_2=%23006d32&color_dot_3=%231f6feb&color_dot_4=%2358a6ff
            dist/github-robot-dark.svg?palette=github-dark&color_snake=%2358a6ff&color_dot_3=%231f6feb&color_dot_4=%2358a6ff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
